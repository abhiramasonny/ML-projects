[project]
name = "ai-projects"
version = "0.1.0"
description = "A collection of small, single-file AI and simulation projects."
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.31",
    "matplotlib>=3.7",
    "mido>=1.3",
    "mne>=1.6",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10.0",
    "pygame>=2.5",
    "pylatexenc>=2.10",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
    "ultralytics>=8.1",
]

[tool.uv]
package = false
